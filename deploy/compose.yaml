name: kimai-local
services:
  sqldb:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: kimai
      MYSQL_USER: kimai
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the environment file}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?Set DATABASE_ROOT_PASSWORD in the environment file}
    volumes:
      - mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin -uroot -p$$MYSQL_ROOT_PASSWORD ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  kimai:
    image: ${KIMAI_IMAGE:-servicewell/kimai:local}
    pull_policy: never
    build:
      context: ..
      target: prod
      args:
        BASE: apache
        KIMAI: ${KIMAI_VERSION:-servicewell-local}
        TIMEZONE: Europe/Stockholm
      labels:
        org.opencontainers.image.source: https://github.com/servicewell/kimai
    depends_on:
      sqldb:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in the environment file}
      TRUSTED_HOSTS: '^(localhost|127\.0\.0\.1)$'
      TRUSTED_PROXIES: REMOTE_ADDR
      KIMAI_PUBLIC_URL: ${KIMAI_PUBLIC_URL:-https://localhost:8443}
      DEFAULT_URI: ${KIMAI_PUBLIC_URL:-https://localhost:8443}
      SAML_ENTITY_ID: ${SAML_ENTITY_ID:?Set SAML_ENTITY_ID in the environment file}
      HEALTHCHECK_HOST: localhost
      ADMINMAIL: ${ADMIN_EMAIL}
      ADMINPASS: ${ADMIN_PASSWORD}
      DATABASE_URL: "mysql://kimai:${DATABASE_PASSWORD}@sqldb:3306/kimai?charset=utf8mb4&serverVersion=8.4.0"
    volumes:
      - data:/opt/kimai/var/data
      - plugins:/opt/kimai/var/plugins
      - ./config/entra/saml.yaml:/opt/kimai/config/packages/local.yaml:ro
      - ./config/entra/idp.yaml:/opt/kimai/config/packages/entra_idp.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", 'curl -fsS -H "Host: $$HEALTHCHECK_HOST" http://127.0.0.1:8001/']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s
    restart: unless-stopped
  proxy:
    image: caddy:2
    depends_on:
      kimai:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KIMAI_PORT:-8001}:8001"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./config/caddy/local.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/tls:/etc/caddy/tls:ro
    restart: unless-stopped
volumes:
  mysql:
  data:
  plugins:
